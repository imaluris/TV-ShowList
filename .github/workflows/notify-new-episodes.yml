name: Notify new episodes

# Ogni giorno controlla le librerie e manda le notifiche push per i nuovi
# episodi. Si può anche lanciare a mano da GitHub: Actions > Notify new
# episodes > Run workflow (con "dry run" non manda nulla, stampa e basta).
on:
  schedule:
    - cron: "17 16 * * *" # ogni giorno alle 16:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (non manda notifiche e non scrive su Firestore)"
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/notify-new-episodes.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
