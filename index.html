<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d10" />
    <title>TV-ShowList</title>
    <script>
      // Applica il tema salvato prima che React parta, per evitare il lampo di colore sbagliato.
      (function () {
        try {
          var pref = localStorage.getItem("theme-preference");
          var light =
            pref === "light" ||
            (pref !== "dark" &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", light ? "#f6f4ee" : "#0c0d10");
        } catch (e) {}
      })();
    </script>

    <!-- Google Analytics: parte con il consenso NEGATO, lo script del banner
         lo attiva solo se l'utente accetta. Sostituisci G-XXXXXXXXXX. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", { analytics_storage: "denied" });
      gtag("js", new Date());
      gtag("config", "G-M5ERJZ5BKC");
    </script>

    <link rel="stylesheet" href="/src/cookie-banner.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <div
      id="cookie-banner"
      class="cookie-banner"
      role="dialog"
      aria-label="Cookie consent"
    >
      <p class="cookie-text">
        We use cookies to measure how the app is used and improve it. You can
        accept or decline.
      </p>
      <div class="cookie-actions">
        <button id="cookie-decline" class="cookie-btn cookie-btn--decline">
          Decline
        </button>
        <button id="cookie-accept" class="cookie-btn cookie-btn--accept">
          Accept
        </button>
      </div>
    </div>

    <script>
      (function () {
        var b = document.getElementById("cookie-banner");
        var c = null;
        try {
          c = localStorage.getItem("ga_consent");
        } catch (e) {}
        if (c === "granted") {
          gtag("consent", "update", { analytics_storage: "granted" });
        } else if (!c) {
          b.classList.add("cookie-banner--visible");
        }
        function save(value) {
          try {
            localStorage.setItem("ga_consent", value);
          } catch (e) {}
        }
        document
          .getElementById("cookie-accept")
          .addEventListener("click", function () {
            save("granted");
            gtag("consent", "update", { analytics_storage: "granted" });
            b.classList.remove("cookie-banner--visible");
          });
        document
          .getElementById("cookie-decline")
          .addEventListener("click", function () {
            save("denied");
            b.classList.remove("cookie-banner--visible");
          });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
